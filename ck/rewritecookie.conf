#!name=影视飓风 & 美的 获取CK合集
#!desc=一键开启/关闭，获取影视飓风签到Token、美的会员Cookie
#!author=AnyGup
#!system=iOS

[mitm]
hostname = h5.youzan.com, mvip.midea.cn

[rewrite_local]
# > 影视飓风 Club（拦截请求头）
^https:\/\/h5\.youzan\.com\/wscump\/checkin url script-request-header https://raw.githubusercontent.com/AnyGup/gg/refs/heads/main/ck/getcookie.js

# > 美的会员（拦截请求头，抓取 Cookie 存入 MIDEA_COOKIE）
^https:\/\/mvip\.midea\.cn\/ url script-request-header https://raw.githubusercontent.com/AnyGup/gg/refs/heads/main/ck/getcookie.js