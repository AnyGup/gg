#!name=影视飓风 & 奇瑞汽车 获取CK合集
#!desc=一键开启/关闭，获取影视飓风签到Token与奇瑞汽车账号信息
#!author=AnyGup
#!system=iOS

# 声明需要解密的域名
hostname = h5.youzan.com, mobile-consumer-sapp.chery.cn

[rewrite_local]
# > 影视飓风 Club（拦截请求头，获取 access_token 和 Extra-Data）
^https:\/\/h5\.youzan\.com\/wscump\/checkin url script-request-header https://raw.githubusercontent.com/AnyGup/gg/refs/heads/main/getcookie.js

# > 奇瑞汽车（拦截响应体，获取 accountId、access_token 等，执行 script-response-body 需修改脚本为响应拦截）
^https:\/\/mobile-consumer-sapp\.chery\.cn\/web\/user\/current\/details\? url script-response-body https://raw.githubusercontent.com/AnyGup/gg/refs/heads/main/getcookie.js
